<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi Tiết Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome@6.0.0/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">Chi Tiết Sản Phẩm</h4>
                        <a th:href="@{/products}" class="btn btn-secondary btn-sm">
                            <i class="fas fa-arrow-left me-1"></i>Quay lại
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <!-- Hình ảnh sản phẩm -->
                            <div class="col-md-4 text-center">
                                <div th:if="${product.imageUrl}">
                                    <img th:src="@{'/uploads/' + ${product.imageUrl}}" 
                                         class="img-fluid rounded" alt="Product Image"
                                         style="max-height: 300px; object-fit: cover;">
                                </div>
                                <div th:unless="${product.imageUrl}" class="text-muted py-5">
                                    <i class="fas fa-image fa-5x mb-3"></i>
                                    <p>Không có hình ảnh</p>
                                </div>
                            </div>
                            
                            <!-- Thông tin sản phẩm -->
                            <div class="col-md-8">
                                <h3 th:text="${product.name}" class="text-primary"></h3>
                                
                                <div class="mb-3">
                                    <span class="badge bg-info fs-6" th:text="${product.category}"></span>
                                </div>
                                
                                <div class="mb-3">
                                    <strong class="text-success fs-4" 
                                            th:text="${#numbers.formatCurrency(product.price)}"></strong>
                                </div>
                                
                                <div class="mb-3">
                                    <strong>Tình trạng:</strong>
                                    <span th:if="${product.quantity == 0}" class="badge bg-danger ms-2">
                                        Hết hàng
                                    </span>
                                    <span th:if="${product.quantity > 0 && product.quantity < 10}" 
                                          class="badge bg-warning ms-2">
                                        Sắp hết hàng
                                    </span>
                                    <span th:if="${product.quantity >= 10}" class="badge bg-success ms-2">
                                        Còn hàng
                                    </span>
                                </div>
                                
                                <div class="mb-3">
                                    <strong>Số lượng trong kho:</strong>
                                    <span th:text="${product.quantity}" class="ms-2"></span>
                                </div>
                                
                                <div class="mb-3">
                                    <strong>Mô tả:</strong>
                                    <p th:text="${product.description ?: 'Không có mô tả'}" 
                                       class="mt-1 text-muted"></p>
                                </div>
                                
                                <div class="row text-muted small">
                                    <div class="col-6">
                                        <strong>Ngày tạo:</strong>
                                        <br>
                                        <span th:text="${#temporals.format(product.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                                    </div>
                                    <div class="col-6">
                                        <strong>Cập nhật lần cuối:</strong>
                                        <br>
                                        <span th:text="${#temporals.format(product.updatedAt, 'dd/MM/yyyy HH:mm')}"></span>
                                    </div>
                                </div>
                                
                                <div class="mt-4">
                                    <a th:href="@{/products/edit/{id}(id=${product.id})}" 
                                       class="btn btn-warning me-2">
                                        <i class="fas fa-edit me-1"></i>Sửa
                                    </a>
                                    <a th:href="@{/products/delete/{id}(id=${product.id})}" 
                                       class="btn btn-danger"
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')">
                                        <i class="fas fa-trash me-1"></i>Xóa
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
