<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.id != null} ? 'Sửa Sản Phẩm' : 'Thêm Sản Phẩm'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0" th:text="${product.id != null} ? 'Sửa Sản Phẩm' : 'Thêm Sản Phẩm Mới'"></h4>
                    </div>
                    <div class="card-body">
                        <form th:action="${product.id != null} ? @{/products/update/{id}(id=${product.id})} : @{/products/save}" 
                              method="post" enctype="multipart/form-data">
                            
                            <!-- Flash Messages -->
                            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                                <span th:text="${successMessage}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                                <span th:text="${errorMessage}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Tên sản phẩm *</label>
                                        <input type="text" class="form-control" id="name" name="name" 
                                               th:value="${product.name}" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="category" class="form-label">Danh mục</label>
                                        <input type="text" class="form-control" id="category" name="category" 
                                               th:value="${product.category}">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="price" class="form-label">Giá *</label>
                                        <input type="number" class="form-control" id="price" name="price" 
                                               th:value="${product.price}" step="0.01" min="0" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="quantity" class="form-label">Số lượng *</label>
                                        <input type="number" class="form-control" id="quantity" name="quantity" 
                                               th:value="${product.quantity}" min="0" required>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Mô tả</label>
                                <textarea class="form-control" id="description" name="description" 
                                          rows="4" th:text="${product.description}"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="imageFile" class="form-label">Hình ảnh sản phẩm</label>
                                <input type="file" class="form-control" id="imageFile" name="imageFile" 
                                       accept="image/*">
                                <div class="form-text">Chọn file hình ảnh (JPEG, PNG, JPG). Tối đa 5MB.</div>
                                
                                <!-- Hiển thị hình ảnh hiện tại nếu có -->
                                <div th:if="${product.imageUrl}" class="mt-2">
                                    <p class="mb-1">Hình ảnh hiện tại:</p>
                                    <img th:src="@{'/uploads/' + ${product.imageUrl}}" 
                                         class="img-thumbnail" style="max-width: 200px;">
                                </div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/products}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-1"></i>Quay lại
                                </a>
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save me-1"></i>
                                    <span th:text="${product.id != null} ? 'Cập nhật' : 'Thêm mới'"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
